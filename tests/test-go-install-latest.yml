name: Test Go binary installation with latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository-owner: tj-actions
          repository: auto-doc
          version: latest
          language-type: go

      - name: Assert binary_path output is set or action failed gracefully
        env:
          BINARY_PATH: ${{ steps.action.outputs.binary_path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "binary_path: $BINARY_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BINARY_PATH" ]; then
              echo "FAIL: action succeeded but binary_path output is empty"
              exit 1
            fi
            echo "PASS: binary_path is set to $BINARY_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert binary exists and is executable
        if: steps.action.outcome == 'success'
        env:
          BINARY_PATH: ${{ steps.action.outputs.binary_path }}
        run: |
          echo "Checking binary at: $BINARY_PATH"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "FAIL: binary file does not exist at $BINARY_PATH"
            exit 1
          fi
          if [ ! -x "$BINARY_PATH" ]; then
            echo "FAIL: binary is not executable"
            exit 1
          fi
          echo "PASS: binary exists and is executable"

      - name: Assert binary runs correctly
        if: steps.action.outcome == 'success'
        env:
          BINARY_PATH: ${{ steps.action.outputs.binary_path }}
        run: |
          echo "Running binary version check"
          VERSION_OUTPUT=$("$BINARY_PATH" --version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          if [ -n "$VERSION_OUTPUT" ]; then
            echo "PASS: binary ran and produced output: $VERSION_OUTPUT"
          else
            echo "FAIL: binary did not produce any output"
            exit 1
          fi
