name: Test Rust binary installation with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository-owner: BurntSushi
          repository: ripgrep
          version: "14.1.1"
          language-type: rust
          add-prefix-to-version: "true"
      - name: Assert binary_path output or graceful failure
        env:
          BINARY_PATH: ${{ steps.action.outputs.binary_path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "binary_path: $BINARY_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BINARY_PATH" ]; then
              echo "FAIL: action succeeded but binary_path output is empty"
              exit 1
            fi
            if [ ! -f "$BINARY_PATH" ]; then
              echo "FAIL: binary file does not exist at $BINARY_PATH"
              exit 1
            fi
            if [ ! -x "$BINARY_PATH" ]; then
              echo "FAIL: binary is not executable"
              exit 1
            fi
            OUTPUT=$("$BINARY_PATH" --version 2>&1 || true)
            echo "binary output: $OUTPUT"
            if echo "$OUTPUT" | grep -q "14.1.1"; then
              echo "PASS: binary version matches expected 14.1.1"
            else
              echo "FAIL: binary version output did not contain '14.1.1', got: $OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
